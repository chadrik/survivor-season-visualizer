# Build the data, test, and publish the site to GitHub Pages.
# Runs on every push to main, weekly (to pick up new survivoR releases), and by hand.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'  # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build season data from survivoR
        run: npm run data -- --refresh
      # Photos are never committed; keep them between runs so only new players are downloaded.
      - uses: actions/cache@v4
        with:
          path: public/photos
          key: photos-${{ github.run_id }}
          restore-keys: photos-
      - name: Fetch player photos
        run: npm run photos
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
